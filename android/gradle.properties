# org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError # old configuration
org.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# https://docs.gradle.org/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Enables configuration caching. Gradle will try to reuse the build configuration from previous builds. Default is false.
# org.gradle.configuration-cache=false

# When set to true, Gradle will reuse task outputs from any previous build when possible, resulting in much faster builds. Default is false.
org.gradle.caching=true

# Enables project isolation, which enables configuration caching. Default is false.
# org.gradle.unsafe.isolated-projects=false

# source here https://docs.gradle.org/current/userguide/build_environment.html

android.defaults.buildfeatures.buildconfig=true